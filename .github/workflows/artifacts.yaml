name: Working with Artifacts
#artifacts are real world entities that are produced as a result of a software development process. In the context of GitHub Actions, artifacts refer to files or data generated during a workflow run that can be stored and shared between jobs or workflows. Artifacts can include build outputs, test results, logs, or any other files that need to be preserved for later use.
on:
  workflow_dispatch:

env:
  build-artifact-key: app-${{ github.sha }}

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - name: Download cached dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: app/node_modules
          key: deps-node-modules-${{ hashFiles('app/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm ci
      - name: Unit tests
        run: npm run test
      - name: Build code
        run: npm run build
      - name: Upload build files
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.build-artifact-key }}
          path: app/build
  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.build-artifact-key }}
          path: build
      - name: Show folder structure
        run: ls -R