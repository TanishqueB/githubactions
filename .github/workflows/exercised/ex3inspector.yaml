name: INspector

on:
    #push:
    workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect Python
        run: |
          echo "Python version:"
          python --version

          echo "Pip version:"
          pip --version

          echo "Python binary location:"
          which python

          echo "Inspection complete"